name: 🐛 Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in the details below.
        For **security vulnerabilities**, do not use this form — see [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the panel …
        2. Click …
        3. See error
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment method
      options:
        - Docker Compose (with mihomo sidecar)
        - docker run (no sidecar)
        - Bare (python main.py)
        - NAS (Synology / QNAP)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "Relevant output, e.g. `docker compose logs app`. Redact tokens/secrets."
      render: shell
  - type: input
    id: version
    attributes:
      label: Version / image tag
      placeholder: "2.0.0 / latest"
  - type: dropdown
    id: arch
    attributes:
      label: Architecture
      options: [amd64, arm64, other]
